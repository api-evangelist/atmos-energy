meters:
  - name: gas_delivered
    description: Natural gas delivered to the customer meter (utility billing meter, not an API meter)
    unit: Mcf
    aggregation: sum
    dimensions:
      - state
      - rate_class
  - name: distribution_charge
    description: Fixed and tiered distribution charges per state PUC tariff
    unit: month
    aggregation: sum
    dimensions:
      - state
      - rate_class
principles:
  - name: Visibility
    description: Not applicable to API consumption — utility usage is visible via the customer portal
      monthly bill.
  - name: Allocation
    description: Not applicable — single utility account per premise.
  - name: Optimization
    description: Not applicable to API; utility-side levers are conservation and demand-response programs.
  - name: Accountability
    description: Not applicable to API.
