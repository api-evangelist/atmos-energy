description: Atmos Energy is a regulated U.S. natural-gas distribution utility. Its consumer charges
  (gas commodity, distribution) are set by state public-utility commissions, not by an API/SaaS pricing
  page. There is no public developer API or developer pricing program. The Builder Portal and customer
  account management are web tools rather than priced APIs.
sources:
  - https://www.atmosenergy.com/
notes: No public developer API or API pricing exists. Customer-facing rates are tariff-based and filed
  with state regulators per service territory.
plans:
  - id: atmos-energy-no-public-api
    name: No Public API Program
    type: enterprise
    description: Atmos exposes a customer self-service portal and a Builder Portal but no public,
      priced API surface.
